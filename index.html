<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coordinate System Visualization</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            padding: 18px;
            margin: 18px auto;
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0,0,0,0.2);
        }

        .cartesian {
            background: #1565c0;
        }

        .cylindrical {
            background: #2e7d32;
        }

        .spherical {
            background: #6a1b9a;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Coordinate System Visualization</h1>

        <p class="subtitle">
            Interactive 3D visualization of coordinate systems
        </p>

        <a href="cartesian.html" class="button cartesian">
            📐 Cartesian Coordinate System
        </a>

        <a href="Cylindrical.html" class="button cylindrical">
            🌀 Cylindrical Coordinate System
        </a>

        <a href="Spherical.html" class="button spherical">
            🌐 Spherical Coordinate System
        </a>

        <div class="footer">
            Electromagnetic Field Theory
        </div>

    </div>

</body>
</html>
