<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Coordinate System Visualization</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e3f2fd,
                #f3e5f5
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 45px 25px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin: 0;

            font-size: 34px;

            color: #222;
        }

        .subtitle {
            margin-top: 12px;
            margin-bottom: 35px;

            font-size: 17px;

            color: #666;

            line-height: 1.5;
        }

        .button {
            display: block;

            width: 90%;
            max-width: 480px;

            margin: 18px auto;

            padding: 20px;

            border-radius: 14px;

            text-decoration: none;

            color: white;

            font-size: 20px;

            font-weight: bold;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.2);
        }

        .cartesian {
            background: #1565c0;
        }

        .cylindrical {
            background: #2e7d32;
        }

        .spherical {
            background: #7b1fa2;
        }

        .icon {
            font-size: 25px;
            margin-right: 8px;
        }

        .footer {
            margin-top: 35px;

            font-size: 14px;

            color: #777;
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 27px;
            }

            .button {
                font-size: 17px;
                padding: 17px;
            }

            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Coordinate System Visualization</h1>

        <p class="subtitle">
            Interactive 3D visualization of
            Cartesian, Cylindrical and Spherical
            coordinate systems
        </p>


        <!-- Cartesian -->
        <a href="cartesian.html"
           class="button cartesian">

            <span class="icon">📐</span>
            Cartesian Coordinate System

        </a>


        <!-- Cylindrical -->
        <a href="cylindrical.html"
           class="button cylindrical">

            <span class="icon">🌀</span>
            Cylindrical Coordinate System

        </a>


        <!-- Spherical -->
        <a href="spherical.html"
           class="button spherical">

            <span class="icon">🌐</span>
            Spherical Coordinate System

        </a>


        <div class="footer">
            Electromagnetic Field Theory
        </div>

    </div>

</body>
</html>
